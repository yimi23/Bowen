<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOWEN</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230a0a0a' stroke='%23c8b89a' stroke-width='2'/><text x='16' y='21' text-anchor='middle' font-size='14' fill='%23c8b89a' font-family='serif'>B</text></svg>" />
</head>
<body>

  <!-- System pulse bar (3px, top of screen, active when busy) -->
  <div id="system-pulse"></div>

  <div id="app">

    <!-- Voice mode: full-screen orb + overlays -->
    <div id="voice-mode">
      <canvas id="orb-canvas"></canvas>

      <!-- Invisible tap zone centered over orb -->
      <div id="orb-tap" title="Tap to speak"></div>

      <!-- Ripple rings (CSS-animated during listening / speaking) -->
      <div id="ripple-1" class="ripple-ring"></div>
      <div id="ripple-2" class="ripple-ring"></div>

      <!-- BOWEN wordmark -->
      <div id="bowen-wordmark">BOWEN</div>

      <!-- Status pill (frosted capsule) -->
      <div id="status-pill">
        <span id="status-text">READY</span>
      </div>

      <!-- Mic level bar (visible only while listening) -->
      <div id="mic-bar">
        <div id="mic-bar-fill"></div>
      </div>

      <!-- Chat toggle (bottom-right) -->
      <button id="chat-toggle" title="Open chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
    </div>

    <!-- Chat panel (slide-in drawer from right) -->
    <div id="chat-panel">
      <header id="chat-header">
        <span id="connection-dot" class="dot disconnected" title="Connecting..."></span>
        <button id="chat-close" title="Close chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </header>

      <div id="chat-messages"></div>

      <!-- Tool activity panel -->
      <div id="tool-activity" class="hidden"></div>

      <!-- Planning modal -->
      <div id="planning-modal" class="hidden">
        <div id="planning-questions"></div>
        <div id="planning-actions">
          <button id="planning-skip">Skip</button>
          <button id="planning-submit">Send answers</button>
        </div>
      </div>

      <!-- Approval modal -->
      <div id="approval-modal" class="hidden">
        <div id="approval-content"></div>
        <div id="approval-actions">
          <button id="approval-deny">Deny</button>
          <button id="approval-approve">Approve</button>
        </div>
      </div>

      <footer id="input-area">
        <textarea
          id="chat-input"
          placeholder="Type to BOWEN..."
          rows="1"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button id="send-btn" title="Send (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </footer>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
